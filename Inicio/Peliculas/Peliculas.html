<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <title>Películas | Cinemorfosis</title>
    <link rel="stylesheet" type="text/css" href="../Inicio.css" />
    <link rel="stylesheet" type="text/css" href="Peliculas.css" />
  </head>
  <body>
    <!-- Encabezado con fondo rojo y buscador -->
    <header class="hero-header">
      <div class="subpage-header">
        <a href="../Inicio.html" class="back-btn" aria-label="Volver">
          <ion-icon name="arrow-back-outline"></ion-icon>
        </a>
        <img src="../../Imagenes/Variante Logo.png" alt="Cinemorfosis" />
        <h1>Películas</h1>

        <div class="user-menu" style="margin-left: auto;">
          <button type="button" class="avatar-btn" id="avatarBtn" aria-haspopup="true" aria-expanded="false">
            <ion-icon name="person-circle-outline"></ion-icon>
          </button>
          <div class="avatar-dropdown" id="avatarDropdown">
            <a href="#"><ion-icon name="person-outline"></ion-icon> Mi perfil</a>
            <a href="#"><ion-icon name="ticket-outline"></ion-icon> Mis tickets</a>
            <a href="../../Login/Login.html" class="logout"><ion-icon name="log-out-outline"></ion-icon> Cerrar sesión</a>
          </div>
        </div>
      </div>

      <div class="hero-content">
        <h2>Explorá el catálogo</h2>
        <p>Buscá tus películas favoritas por título para ver su información y póster.</p>

        <div class="search-box">
          <ion-icon name="search-outline" class="search-icon"></ion-icon>
          <input 
            type="text" 
            id="searchInput" 
            class="search-input" 
            placeholder="¿Qué película querés ver?"
          />
          <button id="searchButton" class="search-btn">
            Buscar &rarr;
          </button>
        </div>
      </div>

      <!-- Cinta de película inferior -->
      <div class="film-strip film-strip--bottom" aria-hidden="true"></div>
    </header>

    <!-- Sección del catálogo sobre fondo claro -->
    <main class="catalog-section">
      <div id="resultsContainer" class="results-grid"></div>
    </main>

    <footer class="site-footer">
      <div class="film-strip film-strip--top" aria-hidden="true"></div>
      <p>Cinemorfosis · Hecho por cinéfilos, para cinéfilos</p>
    </footer>

    <script src="../Inicio.js"></script>
    <script src="Peliculas.js"></script>
  </body>
</html>
