<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src=" https://unpkg.com/ionicons@4.5.10-0/dist/ionicons.js "> </script>
  <title>Iniciar sesión | Cinemorfosis</title>
  <link rel="stylesheet" type="text/css" href="CSS/loginBUENO.css">
</head>
<body>
  <div class="wrapper">
    <div class="film-strip film-strip--top" aria-hidden="true"></div>

    <div class="form-wrapper sign-in">
      <form action="">
        <img class="brand-logo" src="logo-cinemorfosis.png" alt="Cinemorfosis">

        <div class="input-group">
          <input type="text" required>
          <label for=""> <p><ion-icon name="contact"></ion-icon>    Usuario</label></p>
        </div>
        <div class="input-group">
          <input type="password" required>
          <p><label for=""><ion-icon name="lock"></ion-icon>     Contraseña</label></p>
        </div>
        <div class="remember">
          <label><input type="checkbox"> Recordarme</label>
          <div class="signUp-link-olvidastecontraseña">
           <p>   <a href="#"class="forgot-link" data-view="forgot">¿Olvidaste tu contraseña?</a></p>
    </div>
        </div>

         

        <button type="submit" class="cta" aria-label="Ingresar">
          <svg class="cta-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="signUp-link">
          <p>¿No tenés cuenta? <a href="#" class="signUpBtn-link">Registrate</a></p>
        </div>
      </form>
    </div>


    <div class="form-wrapper sign-up">
      <form action="">
        <img class="brand-logo" src="logo-cinemorfosis.png" alt="Cinemorfosis">

        <div class="input-group">
          <input type="text" required>
          <label for="">Usuario</label>
        </div>
        <div class="input-group">
          <input type="email" required>
          <label for="">Email</label>
        </div>
        <div class="input-group">
          <input type="password" required>
          <label for="">Contraseña</label>
        </div>
        <div class="remember">
          <label><input type="checkbox"> Acepto los términos y condiciones</label>
        </div>

        <button type="submit" class="cta" aria-label="Crear cuenta">
          <svg class="cta-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="signUp-link">
          <p>¿Ya tenés cuenta? <a href="#" class="signInBtn-link">Iniciar sesión</a></p>
        </div>
      </form>
    </div>

    <div class="film-strip film-strip--bottom" aria-hidden="true"></div>

    <div class="film-strip film-strip--bottom" aria-hidden="true"></div>
    --- OLVIDASTE CONTRASEÑA ---
    <div class="form-wrapper forgot-password">
        <form id="forgotForm">
          <img class="brand-logo" src="logo-cinemorfosis.png" alt="Cinemorfosis">
          <p class="panel-hint">Recuperá tu contraseña</p>

          <div class="input-group">
            <ion-icon name="mail-outline" class="input-icon"></ion-icon>
            <input type="email" id="forgotEmail" required>
            <label>Email</label>
          </div>
          <div class="input-group">
            <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
            <input type="password" id="newPassword" required minlength="6">
            <label>Nueva contraseña</label>
          </div>
          <div class="input-group">
            <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
            <input type="password" id="confirmPassword" required minlength="6">
            <label>Confirmar contraseña</label>
          </div>

          <p class="form-message" id="forgotMessage" aria-live="polite"></p>

          <button type="submit" class="cta" aria-label="Restablecer contraseña">
            <svg class="cta-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <div class="signUp-link">
            <p>¿Recordaste tu contraseña? <a href="#" data-view="signin">Iniciar sesión</a></p>
          </div>
        </form>
      </div>
  </div>
  <script src="JS/loginBUENO.js"></script>

  </div>

  
  <script src="JS/loginBUENO.js"></script>
</body>
</html>
